# List of plugins
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'
## set -g @plugin 'fabioluciano/tmux-tokyo-night'
set -g @plugin 'dracula/tmux'

set -g @dracula-show-fahrenheit false
set -g @dracula-show-flags true
set -g @dracula-show-left-icon session
set -g @dracula-plugins "custom:../../../claude_usage.sh battery time"
set -g @dracula-custom-plugin-colors "cyan dark_gray"
set -g status-interval 60
set -g @dracula-battery-label "♥ "
set -g @dracula-military-time true
set -s default-terminal 'tmux-256color'

# Start windows and panes at 1, not 0
set -g base-index 1
setw -g pane-base-index 1
set -g mouse on

# Renumber automatically
set -g renumber-windows on

bind-key -n C-S-Left swap-window -t -1\; select-window -t -1
bind-key -n C-S-Right swap-window -t +1\; select-window -t +1

set-option -g destroy-unattached on

set -g prefix C-space
unbind-key C-b
bind-key C-space send-prefix

bind c new-window -c "#{pane_current_path}"
bind '"' split-window -c "#{pane_current_path}"
bind % split-window -h -c "#{pane_current_path}"

# Default session layout (3 windows, 1 | 2/3 panes) for every new session.
# Note: oh-my-zsh's tmux plugin names sessions after the directory, so this
# can't be limited to auto-named (numeric) sessions.
set-hook -g after-new-session "run-shell \"~/.config/tmux/session_layout.sh '#{session_id}'\""

# Automatically set window title based on session name
set-option -g set-titles on
set-option -g set-titles-string "#S: #W"

# Update pane title based on current command
set-option -g automatic-rename on

run '~/.config/tmux/plugins/tpm/tpm'

# Ctrl+Tab / Ctrl+Shift+Tab switch windows (with or without the prefix).
# The terminal must send CSI-u for these: in iTerm2 map ^Tab to "Send Escape
# Sequence" `[9;5u` and ^⇧Tab to `[9;6u`. tmux names Ctrl+Shift+Tab C-BTab.
bind-key -n C-Tab next-window
bind-key -n C-BTab previous-window
bind-key C-Tab next-window
bind-key C-BTab previous-window

# Claude Code pass through https://code.claude.com/docs/en/terminal-config#configure-tmux
set -g allow-passthrough on
set -s extended-keys on
set -as terminal-features 'xterm*:extkeys'
